name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and lint dependencies
        run: python -m pip install --upgrade pip pyyaml pandas ruff

      - name: Lint and syntax check
        run: |
          python -m py_compile bclqc.py picard_qcsum.py tests/test_picard_qcsum.py
          ruff check .

      - name: Run unit and integration tests
        run: python -W error -m unittest discover -s tests -v

defaults:
  bams_dir: /mnt/pns/bams
  fastqs_dir: /staging/hot/reads
  dragen_tmp_dir: /staging/tmp
  picard_ref: /mnt/pns/tracks/ref/hg38.fa
  picard_xmx: 4g
  qc_workers: 4
  platform: NovaSeq6000

# Maps BCLConvert index directory (from SampleSheet_<index>.csv) to DRAGEN alignment settings.
align_groups:
  I10:
    panel: PCP
    bed: /mnt/pns/tracks/ucla_mdl_cancer_ngs_v1_exon_targets.hg38.bed
    human_ref: /staging/human/reference/hg38_alt_masked_graph_v3
    extra_dragen_args:
      - "--enable-duplicate-marking"
      - "true"
  U5N2_I10:
    panel: HEME
    bed: /mnt/pns/tracks/goal_ucla_heme_221_exon_targets.hg38.bed
    human_ref: /staging/human/reference/hg38_alt_masked_graph_v3
    extra_dragen_args:
      - "--umi-enable"
      - "true"
      - "--umi-source"
      - "qname"
      - "--umi-correction-scheme"
      - "random"
      - "--umi-min-supporting-reads"
      - "1"
      - "--umi-metrics-interval-file"
      - "{bed}"
      - "--vc-enable-umi-germline"
      - "true"
      - "--vc-enable-high-sensitivity-mode"
      - "true"
  I8N2_N10:
    skip: true  # Exome samples are demuxed but not aligned here

# QCSum panels: subpanels inherit shared settings via `inherits` and override specific keys.
qc_panels:
  pcp_tumor:
    aliases: ["Tumor"]
    sample_type: Tumor
    bait_intervals: /mnt/pns/tracks/ucla_mdl_cancer_ngs_v1_merged_baits.hg38.ilist
    target_intervals: /mnt/pns/tracks/ucla_mdl_cancer_ngs_v1_exon_targets.hg38.ilist
    pipeline_version: PCPTNDx-v2.0
    capture: twist
    capture_version: v1.0
    covered: 250
    fail_min_align_pct: 97.0
    fail_min_roi_pct: 90
    fail_min_avgcov: 400
    fail_min_reads: 66000000
  pcp_normal:
    aliases: ["Normal"]
    sample_type: Normal
    inherits: pcp_tumor
    covered: 20
    fail_min_align_pct: 98.0
    fail_min_roi_pct: 99
    fail_min_avgcov: 100
    fail_min_reads: 26000000
  heme_comp:
    aliases: ["Comprehensive Heme Panel"]
    sample_type: ""
    bait_intervals: /mnt/pns/tracks/goal_ucla_heme_221_merged_baits.hg38.ilist
    target_intervals: /mnt/pns/tracks/hemev2_roi.interval_list
    pipeline_version: HemeDx-v2.2.0
    capture: goal
    capture_version: v1.0
    covered: 500
    fail_min_align_pct: 99.0
    fail_min_roi_pct: 85
    fail_min_avgcov: 1070
    fail_min_reads: 19000000
  heme_mpn:
    aliases: ["MPN Screen Panel (JAK2, CALR, MPL)"]
    inherits: heme_comp
    target_intervals: /mnt/pns/tracks/hemev2_subpanel/MPN.cds10bp.interval_list
  heme_jak2:
    aliases: ["JAK2"]
    inherits: heme_comp
    target_intervals: /mnt/pns/tracks/hemev2_subpanel/JAK2.cds10bp.interval_list
  heme_pblp:
    aliases: ["Peripheral Blood Lymphoma Panel"]
    inherits: heme_comp
    target_intervals: /mnt/pns/tracks/hemev2_subpanel/PBLP.cds10bp.interval_list
